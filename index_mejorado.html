<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión — Instituto Leloir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base:        #080f0b;
            --bg-surface:     #0d1710;
            --bg-card:        #101a13;
            --bg-hover:       #141e18;
            --border-subtle:  #1a2e20;
            --border-active:  #2d5a3d;
            --green-bright:   #34d399;
            --green-dim:      #163825;
            --yellow-bright:  #fbbf24;
            --yellow-dim:     #2a1f0a;
            --red-bright:     #f87171;
            --red-dim:        #2a0e0e;
            --text-primary:   #e8ede9;
            --text-secondary: #7a9e87;
            --text-muted:     #3d5a47;
            --sidebar-w:      260px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e3329; border-radius: 10px; }

        .serif { font-family: 'DM Serif Display', serif; }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-w);
            background: linear-gradient(180deg, #0a1810 0%, #060e09 100%);
            border-right: 1px solid var(--border-subtle);
            position: fixed;
            top: 0; left: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            z-index: 50;
        }
        .sidebar-logo-area {
            padding: 24px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .logo-ring {
            background: linear-gradient(135deg, #163825, #0d2e1c);
            border: 1px solid #2d5a3d;
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px; font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
            position: relative;
        }
        .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
        .nav-item.active {
            background: rgba(52,211,153,0.09);
            border-left-color: var(--green-bright);
            color: var(--green-bright);
        }
        .nav-section-label {
            font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--text-muted);
            padding: 16px 14px 6px;
        }

        /* ── Main ── */
        .main-content {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            padding: 32px;
            max-width: 1400px;
        }

        /* ── Metric cards ── */
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 22px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .metric-card:hover { transform: translateY(-2px); border-color: var(--border-active); }
        .metric-card:hover::before { opacity: 1; }

        /* ── Table ── */
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table thead tr {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
        }
        .data-table thead th {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--text-muted);
            padding: 14px 18px;
        }
        .data-table tbody tr {
            border-bottom: 1px solid #0f1912;
            transition: background 0.12s;
            cursor: pointer;
        }
        .data-table tbody tr:hover { background: var(--bg-hover); }
        .data-table tbody td { padding: 13px 18px; font-size: 13px; }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: var(--green-bright); }

        /* ── Badges ── */
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 9px; border-radius: 999px;
            font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.07em;
        }
        .badge-ok   { background: #0a2718; color: var(--green-bright); border: 1px solid #154a2a; }
        .badge-warn { background: var(--yellow-dim); color: var(--yellow-bright); border: 1px solid #4a3510; }
        .badge-crit { background: var(--red-dim); color: var(--red-bright); border: 1px solid #4a1818; }
        .badge-insc-ok   { background: #0a2718; color: var(--green-bright); border: 1px solid #154a2a; }
        .badge-insc-pend { background: var(--red-dim); color: var(--red-bright); border: 1px solid #4a1818; }

        /* ── Inputs ── */
        .search-input {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 9px 12px 9px 36px;
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus {
            border-color: var(--green-bright);
            box-shadow: 0 0 0 3px rgba(52,211,153,0.08);
        }
        .search-input::placeholder { color: var(--text-muted); }

        .filter-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px; font-weight: 600;
            cursor: pointer;
            transition: all 0.12s;
            font-family: 'DM Sans', sans-serif;
        }
        .filter-btn:hover { border-color: var(--border-active); color: var(--text-primary); }
        .filter-btn.active {
            background: rgba(52,211,153,0.1);
            border-color: var(--green-bright);
            color: var(--green-bright);
        }
        select.filter-select {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px; font-weight: 600;
            cursor: pointer;
            outline: none;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.15s;
        }
        select.filter-select:focus { border-color: var(--green-bright); }
        select.filter-select option { background: #111a14; }

        /* ── Buttons ── */
        .btn-primary {
            background: linear-gradient(135deg, #163825, #0f2a1a);
            border: 1px solid var(--border-active);
            color: var(--green-bright);
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            display: inline-flex; align-items: center; gap-6px;
            gap: 6px;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #1e4a30, #163825);
            box-shadow: 0 0 20px rgba(52,211,153,0.15);
        }
        .btn-secondary {
            background: rgba(52,211,153,0.07);
            border: 1px solid rgba(52,211,153,0.18);
            color: var(--green-bright);
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
        }
        .btn-secondary:hover { background: rgba(52,211,153,0.12); }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── Modal ── */
        .modal-backdrop {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
        }
        .modal-card {
            background: linear-gradient(145deg, #0f1a13, #0a1209);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
        }

        /* ── Month tags ── */
        .month-tag {
            background: #180b0b;
            border: 1px solid #3d1a1a;
            color: var(--red-bright);
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em;
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
        }

        /* ── Note area ── */
        .note-area {
            background: #090f0b;
            border: 1px solid var(--border-subtle);
            color: #c5d8ca;
            border-radius: 10px;
            padding: 12px;
            font-size: 12px;
            line-height: 1.6;
            resize: none;
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s;
        }
        .note-area:focus { outline: none; border-color: var(--green-bright); }
        .note-area::placeholder { color: var(--text-muted); }

        /* ── Pulse ── */
        .pulse-dot {
            width: 7px; height: 7px;
            background: var(--green-bright);
            border-radius: 50%;
            animation: pulse 2.5s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        /* ── Fade animations ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.3s ease forwards; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .fade-in { animation: fadeIn 0.25s ease forwards; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            background: #0d2e1c;
            border: 1px solid #1a4a2e;
            color: var(--green-bright);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
            z-index: 9999;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            animation: fadeUp 0.3s ease forwards;
        }

        /* ── Section divider ── */
        .section-divider {
            border: none;
            border-top: 1px solid var(--border-subtle);
            margin: 24px 0;
        }

        /* ── Stat highlight in modal ── */
        .stat-pill {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
        }

        /* ── Table wrapper ── */
        .table-wrapper {
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            overflow: hidden;
        }

        /* ── Empty state ── */
        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: var(--text-muted);
        }

        /* ── Print ── */
        @media print {
            .sidebar, .no-print { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 16px; }
            body { background: white; color: black; }
            .metric-card, .table-wrapper { border: 1px solid #ccc !important; }
        }

        /* ── Responsive mobile ── */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px; }
        }

        /* ── Tab bar on modal ── */
        .tab-btn {
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px; font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            background: transparent;
            border: none;
            font-family: 'DM Sans', sans-serif;
        }
        .tab-btn.active {
            background: rgba(52,211,153,0.1);
            color: var(--green-bright);
        }
        .tab-btn:hover:not(.active) { color: var(--text-secondary); }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

const Icon = ({ name, size = 18, className = "", style }) => (
    <i data-lucide={name} className={className} style={{ width: size, height: size, display:'inline-block', flexShrink:0, ...style }}></i>
);

const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSpEUAScY_WitIBOi5oqPCW0IV8-FE-8UMzV1PTaDZhYJrP9283ZIEp--4wNsLJJ5MX3skdScKj669H/pub?gid=0&single=true&output=csv';

const MONTH_CONFIG = [
    { name:"Marzo",           monthIndex:2  },
    { name:"Abril",           monthIndex:3  },
    { name:"Mayo",            monthIndex:4  },
    { name:"Junio",           monthIndex:5  },
    { name:"Mant. Junio",     monthIndex:5  },
    { name:"Julio",           monthIndex:6  },
    { name:"Agosto",          monthIndex:7  },
    { name:"Septiembre",      monthIndex:8  },
    { name:"Octubre",         monthIndex:9  },
    { name:"Noviembre",       monthIndex:10 },
    { name:"Mant. Noviembre", monthIndex:10 },
    { name:"Diciembre",       monthIndex:11 }
];

// ── Helpers ───────────────────────────────────────────────────────────────────
function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
    const now = new Date();
    const currentMonth = now.getMonth();

    return lines.slice(1).map((row, index) => {
        const cols = [];
        let cur = '', inQ = false;
        for (let ch of row) {
            if (ch === '"') inQ = !inQ;
            else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
            else cur += ch;
        }
        cols.push(cur.trim());

        const level       = cols[0]  || "N/A";
        const grade       = cols[1]  || "S/D";
        const studentName = (cols[4] || "S/A").toUpperCase();
        const inscripcion = cols[9]  || "";
        const feeData     = cols.slice(11, 23);
        const unpaidMonths = [];
        const paidMonths   = [];

        feeData.forEach((val, idx) => {
            const config  = MONTH_CONFIG[idx];
            if (!config) return;
            const isPast  = config.monthIndex <= currentMonth;
            const isEmpty = !val || val.trim() === "" || val.toLowerCase() === "debe";
            if (isPast) {
                if (isEmpty) unpaidMonths.push(config.name);
                else paidMonths.push(config.name);
            }
        });

        return {
            id: index,
            level,
            grade,
            fullName:         studentName,
            hasInscripcion:   inscripcion.trim() !== "",
            unpaidMonthsList: unpaidMonths,
            paidMonthsList:   paidMonths,
            monthsOwed:       unpaidMonths.length,
            monthsPaid:       paidMonths.length,
        };
    });
}

function getNotes() {
    try { return JSON.parse(localStorage.getItem('leloir_notes') || '{}'); }
    catch { return {}; }
}
function saveNote(id, text) {
    const notes = getNotes();
    notes[id] = text;
    localStorage.setItem('leloir_notes', JSON.stringify(notes));
}
function getContacts() {
    try { return JSON.parse(localStorage.getItem('leloir_contacts') || '{}'); }
    catch { return {}; }
}
function saveContact(id, data) {
    const contacts = getContacts();
    contacts[id] = data;
    localStorage.setItem('leloir_contacts', JSON.stringify(contacts));
}

function exportCSV(data) {
    const header = ['Nombre','Curso','Nivel','Inscripción','Cuotas Adeudadas','Estado','Meses Adeudados'];
    const rows = data.map(f => [
        f.fullName, f.grade, f.level,
        f.hasInscripcion ? 'Pagada' : 'Pendiente',
        f.monthsOwed,
        f.monthsOwed === 0 ? 'Al Día' : f.monthsOwed < 3 ? 'Pendiente' : 'Mora Crítica',
        f.unpaidMonthsList.join(' | ')
    ]);
    const csv = [header, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `morosos_${new Date().toLocaleDateString('es-AR').replace(/\//g,'-')}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

// ── Status ─────────────────────────────────────────────────────────────────────
const getStatus = (months) => {
    if (months === 0) return { label:'Al Día',      css:'badge-ok',   color:'#34d399' };
    if (months < 3)   return { label:'Pendiente',   css:'badge-warn', color:'#fbbf24' };
    return              { label:'Mora Crítica', css:'badge-crit', color:'#f87171' };
};

const StatusBadge = ({ months }) => {
    const s = getStatus(months);
    return <span className={`badge ${s.css}`}>{s.label}</span>;
};

// ── Metric Card ───────────────────────────────────────────────────────────────
const MetricCard = ({ label, value, sub, accent, icon, gradient }) => (
    <div className="metric-card" style={{borderTop:`2px solid ${accent}`}}>
        <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,background:gradient,opacity:0.4,pointerEvents:'none',borderRadius:'14px'}}></div>
        <div style={{position:'relative'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                <p style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.12em',color:accent}}>{label}</p>
                <div style={{width:34,height:34,borderRadius:10,background:accent+'18',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <Icon name={icon} size={15} style={{color:accent}} />
                </div>
            </div>
            <h3 className="serif" style={{fontSize:42,fontWeight:700,color:accent,lineHeight:1,marginBottom:8}}>{value}</h3>
            <p style={{fontSize:11,color:'var(--text-muted)'}}>{sub}</p>
        </div>
    </div>
);

// ── Donut Chart ───────────────────────────────────────────────────────────────
const DonutChart = ({ alDia, pendiente, criticos }) => {
    const canvasRef = useRef(null);
    const chartRef  = useRef(null);
    const total = alDia + pendiente + criticos;

    useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        chartRef.current = new Chart(canvasRef.current, {
            type: 'doughnut',
            data: {
                labels: ['Al Día','Pendiente','Mora Crítica'],
                datasets: [{
                    data: [alDia, pendiente, criticos],
                    backgroundColor: ['#0a2718','#2a1f0a','#2a0e0e'],
                    borderColor:     ['#34d399','#fbbf24','#f87171'],
                    borderWidth: 2,
                    hoverOffset: 8
                }]
            },
            options: {
                cutout: '74%',
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#7a9e87',
                            font: { size: 11, family: 'DM Sans' },
                            padding: 16,
                            boxWidth: 10, boxHeight: 10,
                            usePointStyle: true, pointStyle: 'circle'
                        }
                    },
                    tooltip: {
                        backgroundColor: '#111a14',
                        borderColor: '#1e3329',
                        borderWidth: 1,
                        titleColor: '#e8e8e0',
                        bodyColor: '#7a9e87',
                        padding: 12,
                        callbacks: {
                            label: (ctx) => ` ${ctx.parsed} alumnos (${total ? Math.round(ctx.parsed/total*100) : 0}%)`
                        }
                    }
                }
            }
        });
        return () => chartRef.current?.destroy();
    }, [alDia, pendiente, criticos]);

    return (
        <div className="metric-card" style={{borderTop:'2px solid #34d399'}}>
            <p style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.12em',color:'#34d399',marginBottom:16}}>Distribución</p>
            <div style={{position:'relative',height:200}}>
                <canvas ref={canvasRef}></canvas>
            </div>
        </div>
    );
};

// ── Note Field ────────────────────────────────────────────────────────────────
const NoteField = ({ familyId }) => {
    const [note, setNote]   = useState(() => getNotes()[familyId] || '');
    const [saved, setSaved] = useState(false);

    const handleSave = () => {
        saveNote(familyId, note);
        setSaved(true);
        setTimeout(() => setSaved(false), 1800);
    };

    return (
        <div style={{marginTop:20}}>
            <p style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em',color:'rgba(52,211,153,0.5)',marginBottom:8}}>
                Notas internas
            </p>
            <textarea
                className="note-area"
                rows={3}
                placeholder="Ej: Llamó el 3/5, acordó pago para el viernes…"
                value={note}
                onChange={e => setNote(e.target.value)}
            />
            <button onClick={handleSave} className="btn-primary" style={{marginTop:8,fontSize:12}}>
                <Icon name={saved ? 'check' : 'save'} size={13} />
                {saved ? 'Guardado' : 'Guardar nota'}
            </button>
        </div>
    );
};

// ── Contact Field ─────────────────────────────────────────────────────────────
const ContactField = ({ familyId }) => {
    const initial  = getContacts()[familyId] || { phone:'', email:'' };
    const [phone, setPhone]   = useState(initial.phone);
    const [email, setEmail]   = useState(initial.email);
    const [saved, setSaved]   = useState(false);

    const handleSave = () => {
        saveContact(familyId, { phone, email });
        setSaved(true);
        setTimeout(() => setSaved(false), 1800);
    };

    return (
        <div>
            <p style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em',color:'rgba(52,211,153,0.5)',marginBottom:10}}>
                Datos de contacto
            </p>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
                <div style={{position:'relative'}}>
                    <Icon name="phone" size={13} style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)'}} />
                    <input
                        type="tel"
                        placeholder="Teléfono"
                        value={phone}
                        onChange={e => setPhone(e.target.value)}
                        style={{
                            background:'#090f0b', border:'1px solid var(--border-subtle)',
                            borderRadius:8, padding:'8px 10px 8px 30px',
                            color:'var(--text-primary)', fontSize:12,
                            fontFamily:'DM Sans, sans-serif', width:'100%', outline:'none'
                        }}
                    />
                </div>
                <div style={{position:'relative'}}>
                    <Icon name="mail" size={13} style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)'}} />
                    <input
                        type="email"
                        placeholder="Email"
                        value={email}
                        onChange={e => setEmail(e.target.value)}
                        style={{
                            background:'#090f0b', border:'1px solid var(--border-subtle)',
                            borderRadius:8, padding:'8px 10px 8px 30px',
                            color:'var(--text-primary)', fontSize:12,
                            fontFamily:'DM Sans, sans-serif', width:'100%', outline:'none'
                        }}
                    />
                </div>
                <button onClick={handleSave} className="btn-primary" style={{fontSize:12, alignSelf:'flex-start'}}>
                    <Icon name={saved ? 'check' : 'save'} size={12} />
                    {saved ? 'Guardado' : 'Guardar'}
                </button>
            </div>
        </div>
    );
};

// ── Family Modal ──────────────────────────────────────────────────────────────

                    </div>
                    <div className="stat-pill">
                        <p style={{fontSize:20,fontWeight:700,fontFamily:'DM Serif Display, serif',color:'var(--text-secondary)'}}>

                </div>

                {/* Tabs */}
                <div style={{display:'flex',gap:4,background:'var(--bg-surface)',padding:4,borderRadius:10,marginBottom:16}}>

                <div className="fade-in" key={tab}>

                                Meses adeudados
                            </p>

};

// ── Toast ─────────────────────────────────────────────────────────────────────
const Toast = ({ message, onDone }) => {
    useEffect(() => {
        const t = setTimeout(onDone, 2200);
        return () => clearTimeout(t);
    }, []);
    return (
        <div className="toast">
            <Icon name="check-circle" size={15} />
            {message}
        </div>
    );
};

// ── Main App ──────────────────────────────────────────────────────────────────
const App = () => {
    const [families,       setFamilies]       = useState([]);
    const [loading,        setLoading]        = useState(true);
    const [error,          setError]          = useState(null);
    const [lastSync,       setLastSync]       = useState(null);
    const [searchTerm,     setSearchTerm]     = useState("");
    const [filterStatus,   setFilterStatus]   = useState("todos");
    const [filterInsc,     setFilterInsc]     = useState("todos");
    const [filterGrade,    setFilterGrade]    = useState("todos");
    const [filterLevel,    setFilterLevel]    = useState("todos");
    const [sortCol,        setSortCol]        = useState("monthsOwed");
    const [sortDir,        setSortDir]        = useState("desc");
    const [selectedFamily, setSelectedFamily] = useState(null);
    const [toast,          setToast]          = useState(null);
    const [activeNav,      setActiveNav]      = useState("cuotas");

    useEffect(() => { fetchData(); }, []);
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    const fetchData = async () => {
        setLoading(true);
        setError(null);
        try {
            const res  = await fetch(CSV_URL + '&t=' + Date.now());
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const text = await res.text();
            const parsed = parseCSV(text);
            setFamilies(parsed);
            setLastSync(new Date());
            setToast('Planilla sincronizada');
        } catch (e) {
            setError('No se pudo conectar con la planilla. Verificá tu conexión.');
        } finally {
            setLoading(false);
        }
    };

    const grades = useMemo(() => {
        const set = new Set(families.map(f => f.grade).filter(Boolean));
        return Array.from(set).sort();
    }, [families]);

    const levels = useMemo(() => {
        const set = new Set(families.map(f => f.level).filter(Boolean));
        return Array.from(set).sort();
    }, [families]);

    const metrics = useMemo(() => {
        const alDia     = families.filter(f => f.monthsOwed === 0).length;
        const morosos   = families.filter(f => f.monthsOwed >= 3).length;
        const pendiente = families.filter(f => f.monthsOwed > 0 && f.monthsOwed < 3).length;
        const totalM    = families.reduce((a,f) => a + f.monthsOwed, 0);
        return { total: families.length, alDia, morosos, pendiente, totalM };
    }, [families]);

    const handleSort = col => {
        if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortCol(col); setSortDir('asc'); }
    };

    const filtered = useMemo(() => {
        let data = [...families];
        const q = searchTerm.toLowerCase();
        if (q) data = data.filter(f =>
            f.fullName.toLowerCase().includes(q) ||
            f.grade.toLowerCase().includes(q) ||
            f.level.toLowerCase().includes(q)
        );
        if (filterStatus === 'aldia')   data = data.filter(f => f.monthsOwed === 0);
        if (filterStatus === 'pend')    data = data.filter(f => f.monthsOwed > 0 && f.monthsOwed < 3);
        if (filterStatus === 'critico') data = data.filter(f => f.monthsOwed >= 3);
        if (filterInsc === 'pagada')    data = data.filter(f => f.hasInscripcion);
        if (filterInsc === 'pendiente') data = data.filter(f => !f.hasInscripcion);
        if (filterGrade !== 'todos')    data = data.filter(f => f.grade === filterGrade);
        if (filterLevel !== 'todos')    data = data.filter(f => f.level === filterLevel);

        data.sort((a, b) => {
            let va = a[sortCol], vb = b[sortCol];
            if (typeof va === 'string') va = va.toLowerCase();
            if (typeof vb === 'string') vb = vb.toLowerCase();
            if (va < vb) return sortDir === 'asc' ? -1 : 1;
            if (va > vb) return sortDir === 'asc' ? 1 : -1;
            return 0;
        });
        return data;
    }, [families, searchTerm, filterStatus, filterInsc, filterGrade, filterLevel, sortCol, sortDir]);

    const SortIcon = ({ col }) => {
        if (sortCol !== col) return <Icon name="chevrons-up-down" size={12} className="inline ml-1" style={{opacity:0.3}} />;
        return sortDir === 'asc'
            ? <Icon name="chevron-up"   size={12} className="inline ml-1" style={{color:'var(--green-bright)'}} />
            : <Icon name="chevron-down" size={12} className="inline ml-1" style={{color:'var(--green-bright)'}} />;
    };

    const clearFilters = () => {
        setSearchTerm(""); setFilterStatus("todos");
        setFilterInsc("todos"); setFilterGrade("todos"); setFilterLevel("todos");
    };
    const hasFilters = searchTerm || filterStatus !== 'todos' || filterInsc !== 'todos' || filterGrade !== 'todos' || filterLevel !== 'todos';

    const currentMonthName = new Intl.DateTimeFormat('es-ES', { month:'long' }).format(new Date());

    return (
        <div style={{minHeight:'100vh',display:'flex'}}>

            {/* ── Sidebar ── */}
            <aside className="sidebar">
                <div className="sidebar-logo-area">
                    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:4}}>
                        <div className="logo-ring" style={{width:40,height:40,borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--green-bright)',flexShrink:0}}>
                            <Icon name="graduation-cap" size={19} />
                        </div>
                        <div>
                            <span style={{fontSize:13,fontWeight:700,color:'var(--text-primary)',display:'block',lineHeight:1.3}}>Instituto Leloir</span>
                            <span style={{fontSize:9,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.12em'}}>Gestión de Cobranzas</span>
                        </div>
                    </div>
                </div>

                <nav style={{flex:1,padding:'16px 12px',overflowY:'auto'}}>
                    <div className="nav-section-label">Panel</div>
                    <div className={`nav-item ${activeNav==='cuotas'?'active':''}`} onClick={()=>setActiveNav('cuotas')}>
                        <Icon name="layout-dashboard" size={15} />
                        Estado de Cuotas
                    </div>

                    <div className="nav-section-label" style={{marginTop:8}}>Resumen</div>
                    <div style={{padding:'10px 14px',borderRadius:10,background:'var(--bg-surface)',border:'1px solid var(--border-subtle)',marginBottom:6}}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                            <span style={{fontSize:11,color:'var(--text-muted)'}}>Total alumnos</span>
                            <span style={{fontSize:11,fontWeight:700,color:'var(--text-primary)'}}>{metrics.total}</span>
                        </div>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                            <span style={{fontSize:11,color:'var(--green-bright)'}}>Al día</span>
                            <span style={{fontSize:11,fontWeight:700,color:'var(--green-bright)'}}>{metrics.alDia}</span>
                        </div>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                            <span style={{fontSize:11,color:'var(--yellow-bright)'}}>Pendientes</span>
                            <span style={{fontSize:11,fontWeight:700,color:'var(--yellow-bright)'}}>{metrics.pendiente}</span>
                        </div>
                        <div style={{display:'flex',justifyContent:'space-between'}}>
                            <span style={{fontSize:11,color:'var(--red-bright)'}}>Mora crítica</span>
                            <span style={{fontSize:11,fontWeight:700,color:'var(--red-bright)'}}>{metrics.morosos}</span>
                        </div>
                    </div>
                </nav>

                {/* Sync */}
                <div style={{padding:'12px',borderTop:'1px solid var(--border-subtle)'}}>
                    {lastSync && (
                        <p style={{fontSize:9,color:'var(--text-muted)',textAlign:'center',marginBottom:8}}>
                            Actualizado: {lastSync.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
                        </p>
                    )}
                    <button
                        onClick={fetchData}
                        disabled={loading}
                        className="btn-secondary no-print"
                        style={{width:'100%',justifyContent:'center'}}
                    >
                        <Icon name="refresh-cw" size={13} className={loading ? "animate-spin" : ""} />
                        {loading ? 'Sincronizando…' : 'Sincronizar'}
                    </button>
                </div>
            </aside>

            {/* ── Main ── */}
            <main className="main-content">

                {/* Header */}
                <header style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:28}} className="no-print">
                    <div>
                        <h1 className="serif" style={{fontSize:28,color:'var(--text-primary)',fontWeight:700,marginBottom:4}}>Control de Morosidad</h1>
                        <p style={{fontSize:13,color:'var(--text-secondary)'}}>
                            Deuda calculada al mes de{' '}
                            <span style={{color:'var(--green-bright)',fontWeight:600,textTransform:'capitalize'}}>{currentMonthName}</span>
                        </p>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 14px',borderRadius:999,background:'#0a2718',border:'1px solid #154a2a'}}>
                            <div className="pulse-dot"></div>
                            <span style={{fontSize:10,fontWeight:700,color:'var(--green-bright)',textTransform:'uppercase',letterSpacing:'0.1em'}}>En línea</span>
                        </div>
                        <button onClick={() => exportCSV(filtered)} className="btn-primary">
                            <Icon name="download" size={14} />
                            Exportar CSV
                        </button>
                    </div>
                </header>

                {loading ? (
                    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:200,gap:12,color:'var(--text-muted)'}}>
                        <Icon name="loader" size={20} className="animate-spin" style={{color:'var(--green-bright)'}} />
                        <span style={{fontSize:13}}>Cargando datos desde la planilla…</span>
                    </div>
                ) : error ? (
                    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,padding:48,background:'#180b0b',border:'1px solid #3d1a1a',borderRadius:16,textAlign:'center'}}>
                        <Icon name="wifi-off" size={32} style={{color:'var(--red-bright)'}} />
                        <p style={{fontSize:13,color:'var(--red-bright)',fontWeight:600}}>{error}</p>
                        <button onClick={fetchData} className="btn-primary">
                            <Icon name="refresh-cw" size={14} />
                            Reintentar
                        </button>
                    </div>
                ) : (
                    <>
                        {/* Metric cards */}
                        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:14,marginBottom:20}}>
                            <MetricCard label="Cuotas Vencidas"  value={metrics.totalM}   sub="Total acumulado"         accent="#34d399" icon="file-text"      gradient="radial-gradient(circle at top left, rgba(52,211,153,0.04), transparent)" />
                            <MetricCard label="Alumnos al Día"   value={metrics.alDia}    sub="Sin deudas a la fecha"   accent="#34d399" icon="check-circle"   gradient="radial-gradient(circle at top left, rgba(52,211,153,0.04), transparent)" />
                            <MetricCard label="Con Atraso"       value={metrics.pendiente} sub="Entre 1 y 2 cuotas"     accent="#fbbf24" icon="clock"          gradient="radial-gradient(circle at top left, rgba(251,191,36,0.04), transparent)" />
                            <MetricCard label="Mora Crítica"     value={metrics.morosos}  sub="+3 meses de atraso"      accent="#f87171" icon="alert-triangle" gradient="radial-gradient(circle at top left, rgba(248,113,113,0.04), transparent)" />
                            <DonutChart alDia={metrics.alDia} pendiente={metrics.pendiente} criticos={metrics.morosos} />
                        </div>

                        <hr className="section-divider" />

                        {/* Filters */}
                        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:10}} className="no-print">
                            {/* Search */}
                            <div style={{position:'relative',flex:1,minWidth:220}}>
                                <Icon name="search" size={14} style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)'}} />
                                <input
                                    type="text"
                                    placeholder="Buscar alumno, curso o nivel…"
                                    className="search-input"
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                />
                            </div>

                            {/* Status filter */}
                            <div style={{display:'flex',gap:3,alignItems:'center',background:'var(--bg-surface)',border:'1px solid var(--border-subtle)',borderRadius:10,padding:3}}>
                                {[['todos','Todos'],['aldia','Al Día'],['pend','Pendiente'],['critico','Crítico']].map(([v,l]) => (
                                    <button
                                        key={v}
                                        className={`filter-btn ${filterStatus===v?'active':''}`}
                                        style={{padding:'6px 12px'}}
                                        onClick={() => setFilterStatus(v)}
                                    >{l}</button>
                                ))}
                            </div>

                            {/* Inscripción */}
                            <select className="filter-select" value={filterInsc} onChange={e => setFilterInsc(e.target.value)}>
                                <option value="todos">Inscripción: Todas</option>
                                <option value="pagada">Inscripción Pagada</option>
                                <option value="pendiente">Inscripción Pendiente</option>
                            </select>

                            {/* Nivel */}
                            <select className="filter-select" value={filterLevel} onChange={e => setFilterLevel(e.target.value)}>
                                <option value="todos">Todos los niveles</option>
                                {levels.map(l => <option key={l} value={l}>{l}</option>)}
                            </select>

                            {/* Curso */}
                            <select className="filter-select" value={filterGrade} onChange={e => setFilterGrade(e.target.value)}>
                                <option value="todos">Todos los cursos</option>
                                {grades.map(g => <option key={g} value={g}>{g}</option>)}
                            </select>

                            {/* Clear filters */}
                            {hasFilters && (
                                <button onClick={clearFilters} className="filter-btn" style={{display:'flex',alignItems:'center',gap:5}}>
                                    <Icon name="x" size={12} />
                                    Limpiar
                                </button>
                            )}
                        </div>

                        {/* Result count */}
                        <p style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>
                            Mostrando <span style={{color:'var(--green-bright)',fontWeight:700}}>{filtered.length}</span> de {families.length} alumnos
                            {hasFilters && <span style={{color:'var(--text-muted)'}}> · con filtros activos</span>}
                        </p>

                        {/* Table */}
                        <div className="table-wrapper">
                            <div style={{overflowX:'auto'}}>
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th className="sortable" style={{textAlign:'left'}} onClick={() => handleSort('fullName')}>
                                                Nombre y Apellido <SortIcon col="fullName" />
                                            </th>
                                            <th className="sortable" style={{textAlign:'left'}} onClick={() => handleSort('grade')}>
                                                Curso <SortIcon col="grade" />
                                            </th>
                                            <th className="sortable" style={{textAlign:'left'}} onClick={() => handleSort('level')}>
                                                Nivel <SortIcon col="level" />
                                            </th>
                                            <th style={{textAlign:'center'}}>Inscripción</th>
                                            <th className="sortable" style={{textAlign:'center'}} onClick={() => handleSort('monthsOwed')}>
                                                Cuotas <SortIcon col="monthsOwed" />
                                            </th>
                                            <th>Estado</th>
                                            <th style={{textAlign:'center'}} className="no-print">Detalle</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filtered.length === 0 ? (
                                            <tr>
                                                <td colSpan={7}>
                                                    <div className="empty-state">
                                                        <Icon name="search-x" size={28} style={{color:'var(--text-muted)',display:'block',margin:'0 auto 10px'}} />
                                                        <p style={{fontSize:13,marginBottom:6}}>No se encontraron alumnos con esos filtros</p>
                                                        {hasFilters && (
                                                            <button onClick={clearFilters} className="btn-primary" style={{margin:'0 auto',fontSize:12}}>
                                                                Limpiar filtros
                                                            </button>
                                                        )}
                                                    </div>
                                                </td>
                                            </tr>
                                        ) : filtered.map(f => {
                                            const st = getStatus(f.monthsOwed);
                                            return (
                                                <tr key={f.id} onClick={() => setSelectedFamily(f)}>
                                                    <td style={{fontWeight:600,color:'var(--text-primary)'}}>{f.fullName}</td>
                                                    <td style={{fontSize:11,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.05em'}}>{f.grade}</td>
                                                    <td style={{fontSize:11,color:'var(--text-muted)'}}>{f.level}</td>
                                                    <td style={{textAlign:'center'}}>
                                                        <span className={`badge ${f.hasInscripcion ? 'badge-insc-ok' : 'badge-insc-pend'}`}>
                                                            {f.hasInscripcion ? 'Pagada' : 'Pendiente'}
                                                        </span>
                                                    </td>
                                                    <td style={{textAlign:'center'}}>
                                                        <span className="serif" style={{fontSize:22,fontWeight:700,color:st.color}}>{f.monthsOwed}</span>
                                                    </td>
                                                    <td><StatusBadge months={f.monthsOwed} /></td>
                                                    <td style={{textAlign:'center'}} className="no-print">
                                                        <button
                                                            style={{padding:6,borderRadius:8,background:'transparent',border:'none',color:'var(--text-muted)',cursor:'pointer',transition:'color 0.15s'}}
                                                            onClick={e => { e.stopPropagation(); setSelectedFamily(f); }}
                                                            onMouseEnter={e=>e.currentTarget.style.color='var(--green-bright)'}
                                                            onMouseLeave={e=>e.currentTarget.style.color='var(--text-muted)'}
                                                        >
                                                            <Icon name="eye" size={14} />
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <p style={{fontSize:10,color:'var(--text-muted)',textAlign:'center',marginTop:24}}>
                            Instituto Leloir · Sistema de Gestión de Cobranzas · {new Date().getFullYear()}
                        </p>
                    </>
                )}
            </main>

            {/* Modal */}
            {selectedFamily && (
                <FamilyModal family={selectedFamily} onClose={() => setSelectedFamily(null)} />
            )}

            {/* Toast */}
            {toast && <Toast message={toast} onDone={() => setToast(null)} />}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
