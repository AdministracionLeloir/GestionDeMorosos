<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión — Instituto Leloir</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:      #080f0b;
            --surface: #0d1710;
            --card:    #101a13;
            --hover:   #141e18;
            --b0:      #1a2e20;
            --b1:      #2d5a3d;
            --green:   #34d399;
            --yellow:  #fbbf24;
            --red:     #f87171;
            --t0:      #e8ede9;
            --t1:      #7a9e87;
            --t2:      #3d5a47;
            --sw:      260px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--t0); min-height: 100vh; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e3329; border-radius: 4px; }
        .serif { font-family: 'DM Serif Display', serif; }

        @keyframes spin    { to { transform: rotate(360deg); } }
        @keyframes fadeUp  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
        @keyframes pulse-k { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.75);} }
        .spin     { animation: spin 1s linear infinite; display:inline-block; }
        .fade-up  { animation: fadeUp .28s ease both; }
        .fade-in  { animation: fadeIn .2s ease both; }
        .pulse-dot{ width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse-k 2.5s infinite; }

        /* Layout */
        .sidebar {
            width: var(--sw); background: linear-gradient(180deg,#0a1810,#060e09);
            border-right:1px solid var(--b0); position:fixed; top:0;left:0;bottom:0;
            display:flex; flex-direction:column; z-index:50;
        }
        .main { margin-left:var(--sw); min-height:100vh; padding:32px; }

        /* Nav */
        .nav-label { font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--t2);padding:16px 14px 6px; }
        .nav-item  { display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;color:var(--t1);cursor:pointer;transition:all .15s;border-left:3px solid transparent; }
        .nav-item:hover { background:rgba(255,255,255,.04);color:var(--t0); }
        .nav-item.active{ background:rgba(52,211,153,.09);border-left-color:var(--green);color:var(--green); }

        /* Cards */
        .card { background:var(--card);border:1px solid var(--b0);border-radius:16px;padding:22px;transition:transform .2s,border-color .2s;position:relative;overflow:hidden; }
        .card:hover { transform:translateY(-2px);border-color:var(--b1); }

        /* Table */
        .tbl { width:100%;border-collapse:collapse; }
        .tbl thead tr { background:var(--surface);border-bottom:1px solid var(--b0); }
        .tbl thead th { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t2);padding:14px 18px; }
        .tbl tbody tr { border-bottom:1px solid #0f1912;transition:background .12s;cursor:pointer; }
        .tbl tbody tr:hover { background:var(--hover); }
        .tbl tbody td { padding:13px 18px;font-size:13px; }
        .tbl-wrap { border:1px solid var(--b0);border-radius:14px;overflow:hidden; }
        .sortable { cursor:pointer;user-select:none; }
        .sortable:hover { color:var(--green); }

        /* Badges */
        .badge { display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em; }
        .b-ok   { background:#0a2718;color:var(--green);border:1px solid #154a2a; }
        .b-warn { background:#2a1f0a;color:var(--yellow);border:1px solid #4a3510; }
        .b-crit { background:#2a0e0e;color:var(--red);border:1px solid #4a1818; }
        .b-ipk  { background:#0a2718;color:var(--green);border:1px solid #154a2a; }
        .b-ipd  { background:#2a0e0e;color:var(--red);border:1px solid #4a1818; }

        /* Inputs */
        .s-wrap { position:relative; }
        .s-ico  { position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--t2);pointer-events:none; }
        .s-input{ background:var(--surface);border:1px solid var(--b0);color:var(--t0);border-radius:10px;padding:9px 12px 9px 36px;font-size:13px;font-family:inherit;outline:none;width:100%;transition:border-color .2s; }
        .s-input:focus { border-color:var(--green); }
        .s-input::placeholder { color:var(--t2); }
        .fsel { background:var(--surface);border:1px solid var(--b0);color:var(--t1);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;outline:none;font-family:inherit; }
        .fsel option { background:#111a14; }
        .fbtn { background:var(--surface);border:1px solid var(--b0);color:var(--t1);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s; }
        .fbtn:hover  { border-color:var(--b1);color:var(--t0); }
        .fbtn.active { background:rgba(52,211,153,.1);border-color:var(--green);color:var(--green); }

        /* Buttons */
        .btn-p { background:linear-gradient(135deg,#163825,#0f2a1a);border:1px solid var(--b1);color:var(--green);padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s;font-family:inherit; }
        .btn-p:hover { background:linear-gradient(135deg,#1e4a30,#163825);box-shadow:0 0 20px rgba(52,211,153,.15); }
        .btn-s { background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.18);color:var(--green);padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s;font-family:inherit; }
        .btn-s:hover   { background:rgba(52,211,153,.12); }
        .btn-s:disabled{ opacity:.5;cursor:not-allowed; }

        /* Modal */
        .backdrop { background:rgba(0,0,0,.8);backdrop-filter:blur(8px); }
        .modal-box { background:linear-gradient(145deg,#0f1a13,#0a1209);border:1px solid var(--b0);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.6); }

        /* Month tag */
        .m-tag { background:#180b0b;border:1px solid #3d1a1a;color:var(--red);border-radius:8px;padding:7px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between; }

        /* Misc */
        .note-ta { background:#090f0b;border:1px solid var(--b0);color:#c5d8ca;border-radius:10px;padding:12px;font-size:12px;line-height:1.6;resize:none;width:100%;font-family:inherit;transition:border-color .2s;outline:none; }
        .note-ta:focus   { border-color:var(--green); }
        .c-input  { background:#090f0b;border:1px solid var(--b0);border-radius:8px;padding:9px 12px;color:var(--t0);font-size:12px;font-family:inherit;width:100%;outline:none;transition:border-color .2s; }
        .c-input:focus { border-color:var(--green); }
        .c-input::placeholder { color:var(--t2); }
        .stat-pill{ background:var(--surface);border:1px solid var(--b0);border-radius:10px;padding:10px 14px;text-align:center; }
        .tab-bar  { display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:10px;margin-bottom:16px; }
        .tab-btn  { flex:1;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .15s;background:transparent;border:none;font-family:inherit; }
        .tab-btn.active{ background:rgba(52,211,153,.1);color:var(--green); }
        .sb-sum   { background:var(--surface);border:1px solid var(--b0);border-radius:10px;padding:10px 14px; }
        .sb-row   { display:flex;justify-content:space-between;align-items:center;margin-bottom:6px; }
        .sb-row:last-child{ margin-bottom:0; }
        .toast    { position:fixed;bottom:24px;right:24px;background:#0d2e1c;border:1px solid #1a4a2e;color:var(--green);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeUp .3s ease both; }
        .divider  { border:none;border-top:1px solid var(--b0);margin:24px 0; }
        .empty    { padding:48px 24px;text-align:center;color:var(--t2); }
        .logo-ring{ background:linear-gradient(135deg,#163825,#0d2e1c);border:1px solid #2d5a3d; }
        @media print { .sidebar,.no-print{ display:none!important; } .main{ margin-left:0!important;padding:16px; } }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const Icon = ({ name, size = 18, color, style = {} }) => {
    const svg = ICONS[name];
    if (!svg) return null;
    return (
        <span style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', width:size, height:size, flexShrink:0, color: color || 'currentColor', ...style }}>
            {React.cloneElement(svg, { width: size, height: size })}
        </span>
    );
};

/* ─── Constants ─── */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSpEUAScY_WitIBOi5oqPCW0IV8-FE-8UMzV1PTaDZhYJrP9283ZIEp--4wNsLJJ5MX3skdScKj669H/pub?gid=0&single=true&output=csv';

const MONTHS = [
    { name:'Marzo',           mi:2  }, { name:'Abril',           mi:3  },
    { name:'Mayo',            mi:4  }, { name:'Junio',           mi:5  },
    { name:'Mant. Junio',     mi:5  }, { name:'Julio',           mi:6  },
    { name:'Agosto',          mi:7  }, { name:'Septiembre',      mi:8  },
    { name:'Octubre',         mi:9  }, { name:'Noviembre',       mi:10 },
    { name:'Mant. Noviembre', mi:10 }, { name:'Diciembre',       mi:11 },
];

/* ─── Helpers ─── */
function parseCSV(text) {
    const lines   = text.split(/\r?\n/).filter(l => l.trim());
    const current = new Date().getMonth();
    return lines.slice(1).map((row, idx) => {
        const cols = [];
        let cur = '', inQ = false;
        for (const ch of row) {
            if (ch === '"')          inQ = !inQ;
            else if (ch===',' && !inQ){ cols.push(cur.trim()); cur=''; }
            else cur += ch;
        }
        cols.push(cur.trim());
        const name = (cols[4] || '').trim().toUpperCase();
        if (!name) return null;
        const insc    = (cols[9] || '').trim();
        const fees    = cols.slice(11, 23);
        const unpaid  = [], paid = [];
        fees.forEach((v, i) => {
            const m = MONTHS[i]; if (!m) return;
            if (m.mi > current) return;
            const empty = !v || v.trim()==='' || v.trim().toLowerCase()==='debe';
            if (empty) unpaid.push(m.name); else paid.push(m.name);
        });
        return {
            id: idx, level: cols[0]||'N/A', grade: cols[1]||'S/D',
            fullName: name, hasInsc: insc !== '',
            unpaid, paid,
            owed: unpaid.length, paidCount: paid.length,
        };
    }).filter(Boolean);
}

const LS = {
    getNotes:    () => { try { return JSON.parse(localStorage.getItem('ll_notes')||'{}'); } catch { return {}; } },
    saveNote:    (id,v) => { const n=LS.getNotes(); n[id]=v; localStorage.setItem('ll_notes', JSON.stringify(n)); },
    getContacts: () => { try { return JSON.parse(localStorage.getItem('ll_contacts')||'{}'); } catch { return {}; } },
    saveContact: (id,v) => { const c=LS.getContacts(); c[id]=v; localStorage.setItem('ll_contacts', JSON.stringify(c)); },
};

function exportCSV(data) {
    const hdr = ['Nombre','Curso','Nivel','Inscripción','Cuotas Adeudadas','Estado','Meses Adeudados'];
    const rows = data.map(f => [
        f.fullName, f.grade, f.level,
        f.hasInsc ? 'Pagada' : 'Pendiente', f.owed,
        f.owed===0?'Al Día':f.owed<3?'Pendiente':'Mora Crítica',
        f.unpaid.join(' | '),
    ]);
    const csv  = [hdr,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download=`leloir_${new Date().toLocaleDateString('es-AR').replace(/\//g,'-')}.csv`;
    a.click(); URL.revokeObjectURL(url);
}

function statusOf(n) {
    if (n===0) return { label:'Al Día',      css:'b-ok',   color:'#34d399' };
    if (n<3)   return { label:'Pendiente',   css:'b-warn', color:'#fbbf24' };
    return             { label:'Mora Crítica',css:'b-crit', color:'#f87171' };
}

/* ─── Small components ─── */
const SBadge = ({ n }) => {
    const s = statusOf(n);
    return <span className={"badge "+s.css}>{s.label}</span>;
};

const MetricCard = ({ label, value, sub, color, icon }) => (
    <div className="card" style={{ borderTop:'2px solid '+color }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
            <p style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'.12em', color }}>{label}</p>

const DonutChart = ({ alDia, pend, crit }) => {
    const canvasRef = useRef(null);
    const chartRef  = useRef(null);
    const total = alDia + pend + crit;

    useEffect(() => {
        if (!canvasRef.current || typeof Chart === 'undefined') return;
        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
        try {
            chartRef.current = new Chart(canvasRef.current, {
                type: 'doughnut',
                data: {
                    labels: ['Al Día','Pendiente','Mora Crítica'],
                    datasets: [{ data:[alDia,pend,crit], backgroundColor:['#0a2718','#2a1f0a','#2a0e0e'], borderColor:['#34d399','#fbbf24','#f87171'], borderWidth:2, hoverOffset:8 }]
                },
                options: {
                    cutout:'74%',
                    plugins: {
                        legend:{ position:'bottom', labels:{ color:'#7a9e87', font:{size:11,family:'DM Sans'}, padding:16, boxWidth:10, boxHeight:10, usePointStyle:true, pointStyle:'circle' } },
                        tooltip:{ backgroundColor:'#111a14', borderColor:'#1e3329', borderWidth:1, titleColor:'#e8e8e0', bodyColor:'#7a9e87', padding:12,
                            callbacks:{ label: ctx => ` ${ctx.parsed} (${total?Math.round(ctx.parsed/total*100):0}%)` }
                        }
                    }
                }
            });
        } catch(e) { /* Chart.js load race — ignore */ }
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
    }, [alDia, pend, crit]);

    return (
        <div className="card" style={{ borderTop:'2px solid #34d399' }}>
            <p style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'.12em', color:'#34d399', marginBottom:16 }}>Distribución</p>
            <div style={{ position:'relative', height:200 }}>
                <canvas ref={canvasRef}></canvas>
            </div>
        </div>
    );
};

const Modal = ({ fam, onClose }) => {
    const [tab, setTab] = useState('deuda');
    const st  = statusOf(fam.owed);
    const tot = fam.paidCount + fam.owed;
    const pct = tot > 0 ? Math.round(fam.paidCount / tot * 100) : 100;

    useEffect(() => {
        const h = e => { if (e.key==='Escape') onClose(); };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
    }, []);

    return (
        <div style={{ position:'fixed', inset:0, zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>
            <div className="backdrop" style={{ position:'absolute', inset:0 }} onClick={onClose}></div>
            <div className="modal-box fade-up" style={{ position:'relative', width:'100%', maxWidth:460, padding:28 }}>

                {/* Header */}
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20 }}>
                    <div style={{ display:'flex', gap:14, alignItems:'center' }}>
                        <div className="logo-ring" style={{ width:46, height:46, borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--green)', flexShrink:0 }}>
                            <Icon name="user" size={20} />
                        </div>
                        <div>
                            <h2 className="serif" style={{ fontSize:17, color:'var(--t0)', lineHeight:1.2, marginBottom:3 }}>{fam.fullName}</h2>
                            <p style={{ fontSize:10, color:'var(--t2)', textTransform:'uppercase', letterSpacing:'.1em' }}>{fam.grade} · {fam.level}</p>
                        </div>
                    </div>
                    <button onClick={onClose} style={{ padding:6, borderRadius:8, background:'transparent', border:'none', color:'var(--t2)', cursor:'pointer' }}>
                        <Icon name="x" size={18} />
                    </button>
                </div>

                {/* Badges */}
                <div style={{ display:'flex', gap:8, marginBottom:18, flexWrap:'wrap' }}>
                    <SBadge n={fam.owed} />
                    <span className={"badge "+(fam.hasInsc?'b-ipk':'b-ipd')}>Inscripción {fam.hasInsc?'Pagada':'Pendiente'}</span>
                </div>

                {/* Stats */}
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:18 }}>
                    {[
                        { val:fam.owed,      color:st.color,       label:'Adeudadas' },

                            <p style={{ fontSize:10, color:'var(--t2)', marginTop:2 }}>{label}</p>
                        </div>
                    ))}
                </div>

                {/* Tabs */}
                <div className="tab-bar">
                    {[['deuda','Cuotas'],['notas','Notas'],['contacto','Contacto']].map(([id,lbl]) => (
                        <button key={id} className={"tab-btn"+(tab===id?' active':'')} onClick={()=>setTab(id)}>{lbl}</button>
                    ))}
                </div>

                <div key={tab} className="fade-in">
                    {tab==='deuda' && (
                        <>
                            <p style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'.1em', color:'var(--t2)', marginBottom:10 }}>Meses adeudados</p>
                            {fam.unpaid.length > 0 ? (
                                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6, maxHeight:180, overflowY:'auto' }}>
                                    {fam.unpaid.map((m,i) => (
                                        <div key={i} className="m-tag">
                                            <span>{m}</span>
                                            <Icon name="alert-circle" size={11} />
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div style={{ padding:'28px 0', textAlign:'center', background:'#0a2718', border:'1px solid #154a2a', borderRadius:12 }}>
                                    <Icon name="check-circle" size={26} color="#34d399" style={{ marginBottom:8 }} />
                                    <p style={{ fontSize:11, color:'#34d399', fontWeight:700, textTransform:'uppercase', letterSpacing:'.08em' }}>¡Sin deudas pendientes!</p>
                                </div>
                            )}
                            <p style={{ marginTop:14, fontSize:9, color:'var(--t2)', borderTop:'1px solid var(--b0)', paddingTop:12 }}>
                                Solo se muestran meses transcurridos con celda vacía en la planilla.
                            </p>
                        </>
                    )}
                    {tab==='notas'    && <NoteField id={fam.id} />}
                    {tab==='contacto' && <ContactField id={fam.id} />}
                </div>
            </div>
        </div>
    );
};

const Toast = ({ msg, onDone }) => {
    useEffect(() => { const t=setTimeout(onDone,2200); return ()=>clearTimeout(t); }, []);
    return <div className="toast"><Icon name="check-circle" size={15} />{msg}</div>;
};

/* ─── App ─── */
const App = () => {
    const [fams,    setFams]    = useState([]);
    const [loading, setLoading] = useState(true);
    const [err,     setErr]     = useState(null);
    const [synced,  setSynced]  = useState(null);
    const [q,       setQ]       = useState('');
    const [fSt,     setFSt]     = useState('todos');
    const [fIn,     setFIn]     = useState('todos');
    const [fGr,     setFGr]     = useState('todos');
    const [fLv,     setFLv]     = useState('todos');
    const [sortC,   setSortC]   = useState('owed');
    const [sortD,   setSortD]   = useState('desc');
    const [sel,     setSel]     = useState(null);
    const [toast,   setToast]   = useState(null);

    const load = useCallback(async () => {
        setLoading(true); setErr(null);
        try {
            const r = await fetch(CSV_URL + '&nocache=' + Date.now());
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const txt = await r.text();
            const parsed = parseCSV(txt);
            if (!parsed.length) throw new Error('Sin datos');
            setFams(parsed);
            setSynced(new Date());
            setToast('Planilla sincronizada');
        } catch(e) {
            setErr('No se pudo cargar la planilla. ' + e.message);
        } finally {
            setLoading(false);
        }
    }, []);

    useEffect(() => { load(); }, [load]);

    const grades = useMemo(() => [...new Set(fams.map(f=>f.grade).filter(Boolean))].sort(), [fams]);
    const levels = useMemo(() => [...new Set(fams.map(f=>f.level).filter(Boolean))].sort(), [fams]);

    const metrics = useMemo(() => ({
        total: fams.length,
        alDia: fams.filter(f=>f.owed===0).length,
        pend:  fams.filter(f=>f.owed>0&&f.owed<3).length,
        crit:  fams.filter(f=>f.owed>=3).length,
        total_owed: fams.reduce((a,f)=>a+f.owed,0),
    }), [fams]);

    const filtered = useMemo(() => {
        let d = [...fams];
        const lq = q.toLowerCase();
        if (lq) d = d.filter(f => f.fullName.toLowerCase().includes(lq) || f.grade.toLowerCase().includes(lq) || f.level.toLowerCase().includes(lq));
        if (fSt==='aldia')  d = d.filter(f=>f.owed===0);
        if (fSt==='pend')   d = d.filter(f=>f.owed>0&&f.owed<3);
        if (fSt==='critico')d = d.filter(f=>f.owed>=3);
        if (fIn==='pagada') d = d.filter(f=>f.hasInsc);
        if (fIn==='pend2')  d = d.filter(f=>!f.hasInsc);
        if (fGr!=='todos')  d = d.filter(f=>f.grade===fGr);
        if (fLv!=='todos')  d = d.filter(f=>f.level===fLv);
        d.sort((a,b) => {
            let va=a[sortC], vb=b[sortC];
            if (typeof va==='string'){ va=va.toLowerCase(); vb=vb.toLowerCase(); }
            return sortD==='asc' ? (va<vb?-1:va>vb?1:0) : (va>vb?-1:va<vb?1:0);
        });
        return d;
    }, [fams,q,fSt,fIn,fGr,fLv,sortC,sortD]);

    const toggleSort = col => {
        if (sortC===col) setSortD(d=>d==='asc'?'desc':'asc');
        else { setSortC(col); setSortD('asc'); }
    };
    const SortIco = ({ col }) => {
        if (sortC!==col) return <Icon name="chevrons-updown" size={11} style={{ marginLeft:3, opacity:.4 }} />;
        return <Icon name={sortD==='asc'?'chevron-up':'chevron-down'} size={11} color="#34d399" style={{ marginLeft:3 }} />;
    };

    const clearF = () => { setQ(''); setFSt('todos'); setFIn('todos'); setFGr('todos'); setFLv('todos'); };
    const hasF   = q || fSt!=='todos' || fIn!=='todos' || fGr!=='todos' || fLv!=='todos';
    const month  = new Intl.DateTimeFormat('es-ES',{month:'long'}).format(new Date());

    return (
        <div style={{ minHeight:'100vh', display:'flex' }}>

            {/* Sidebar */}
            <aside className="sidebar">
                <div style={{ padding:24, borderBottom:'1px solid var(--b0)' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                        <div className="logo-ring" style={{ width:40, height:40, borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--green)', flexShrink:0 }}>
                            <Icon name="graduation-cap" size={19} />
                        </div>
                        <div>
                            <span style={{ fontSize:13, fontWeight:700, color:'var(--t0)', display:'block', lineHeight:1.3 }}>Instituto Leloir</span>
                            <span style={{ fontSize:9, color:'var(--t2)', textTransform:'uppercase', letterSpacing:'.12em' }}>Gestión de Cobranzas</span>
                        </div>
                    </div>
                </div>

                <nav style={{ flex:1, padding:'16px 12px', overflowY:'auto' }}>
                    <div className="nav-label">Panel</div>
                    <div className="nav-item active">
                        <Icon name="layout-dashboard" size={15} />
                        Estado de Cuotas
                    </div>

                    {fams.length > 0 && (
                        <>
                            <div className="nav-label" style={{ marginTop:16 }}>Resumen rápido</div>
                            <div className="sb-sum">
                                {[
                                    ['Total',       metrics.total,       'var(--t0)'   ],
                                    ['Al día',      metrics.alDia,       'var(--green)'],
                                    ['Pendientes',  metrics.pend,        'var(--yellow)'],
                                    ['Mora crítica',metrics.crit,        'var(--red)'  ],
                                ].map(([l,v,c]) => (
                                    <div key={l} className="sb-row">
                                        <span style={{ fontSize:11, color:c }}>{l}</span>
                                        <span style={{ fontSize:11, fontWeight:700, color:c }}>{v}</span>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}
                </nav>

                <div style={{ padding:12, borderTop:'1px solid var(--b0)' }}>
                    {synced && <p style={{ fontSize:9, color:'var(--t2)', textAlign:'center', marginBottom:8 }}>Actualizado: {synced.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</p>}
                    <button onClick={load} disabled={loading} className="btn-s no-print" style={{ width:'100%', justifyContent:'center' }}>
                        <span className={loading?'spin':''}><Icon name="refresh-cw" size={13} /></span>
                        {loading?'Sincronizando…':'Sincronizar'}
                    </button>
                </div>
            </aside>

            {/* Main */}
            <main className="main">
                <header style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:28 }} className="no-print">
                    <div>
                        <h1 className="serif" style={{ fontSize:28, color:'var(--t0)', fontWeight:700, marginBottom:4 }}>Control de Morosidad</h1>
                        <p style={{ fontSize:13, color:'var(--t1)' }}>
                            Deuda calculada al mes de <span style={{ color:'var(--green)', fontWeight:600, textTransform:'capitalize' }}>{month}</span>
                        </p>
                    </div>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:6, padding:'6px 14px', borderRadius:999, background:'#0a2718', border:'1px solid #154a2a' }}>
                            <div className="pulse-dot"></div>
                            <span style={{ fontSize:10, fontWeight:700, color:'var(--green)', textTransform:'uppercase', letterSpacing:'.1em' }}>En línea</span>
                        </div>
                        <button onClick={() => exportCSV(filtered)} className="btn-p">
                            <Icon name="download" size={14} /> Exportar CSV
                        </button>
                    </div>
                </header>

                {loading ? (
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:220, gap:12, color:'var(--t2)' }}>
                        <span className="spin" style={{ color:'var(--green)' }}><Icon name="loader" size={22} /></span>
                        <span style={{ fontSize:13 }}>Cargando datos desde la planilla…</span>
                    </div>
                ) : err ? (
                    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:16, padding:48, background:'#180b0b', border:'1px solid #3d1a1a', borderRadius:16, textAlign:'center' }}>
                        <Icon name="wifi-off" size={34} color="#f87171" />
                        <p style={{ fontSize:13, color:'#f87171', fontWeight:600 }}>{err}</p>
                        <button onClick={load} className="btn-p"><Icon name="refresh-cw" size={14} /> Reintentar</button>
                    </div>
                ) : (
                    <>
                        {/* Metrics */}
                        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))', gap:14, marginBottom:24 }}>
                            <MetricCard label="Cuotas Vencidas"  value={metrics.total_owed} sub="Total acumulado"       color="#34d399" icon="file-text"      />
                            <MetricCard label="Alumnos al Día"   value={metrics.alDia}      sub="Sin deudas a la fecha" color="#34d399" icon="check-circle"   />
                            <MetricCard label="Con Atraso"       value={metrics.pend}       sub="Entre 1 y 2 cuotas"   color="#fbbf24" icon="clock"           />
                            <MetricCard label="Mora Crítica"     value={metrics.crit}       sub="+3 meses de atraso"   color="#f87171" icon="alert-triangle"  />
                            <DonutChart alDia={metrics.alDia} pend={metrics.pend} crit={metrics.crit} />
                        </div>

                        <hr className="divider" />

                        {/* Filters */}
                        <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:10 }} className="no-print">

                                <span className="s-ico"><Icon name="search" size={14} /></span>
                                <input className="s-input" type="text" placeholder="Buscar alumno, curso o nivel…" value={q} onChange={e=>setQ(e.target.value)} />
                            </div>
                            <div style={{ display:'flex', gap:3, background:'var(--surface)', border:'1px solid var(--b0)', borderRadius:10, padding:3 }}>
                                {[['todos','Todos'],['aldia','Al Día'],['pend','Pendiente'],['critico','Crítico']].map(([v,l])=>(
                                    <button key={v} className={"fbtn"+(fSt===v?' active':'')} onClick={()=>setFSt(v)}>{l}</button>
                                ))}
                            </div>
                            <select className="fsel" value={fIn} onChange={e=>setFIn(e.target.value)}>
                                <option value="todos">Inscripción: Todas</option>
                                <option value="pagada">Inscripción Pagada</option>

                            <select className="fsel" value={fLv} onChange={e=>setFLv(e.target.value)}>

                                {levels.map(l=><option key={l} value={l}>{l}</option>)}

                            <select className="fsel" value={fGr} onChange={e=>setFGr(e.target.value)}>
                                <option value="todos">Todos los cursos</option>
                                {grades.map(g=><option key={g} value={g}>{g}</option>)}

                            {hasF && (
                                <button onClick={clearF} className="fbtn" style={{ display:'flex', alignItems:'center', gap:5 }}>
                                    <Icon name="x" size={12} /> Limpiar

                        <p style={{ fontSize:11, color:'var(--t2)', marginBottom:10 }}>
                            Mostrando <strong style={{ color:'var(--green)' }}>{filtered.length}</strong> de {fams.length} alumnos{hasF && ' · filtros activos'}
                        </p>

                        {/* Table */}
                        <div className="tbl-wrap">
                            <div style={{ overflowX:'auto' }}>
                                <table className="tbl">
                                    <thead>
                                        <tr>
                                            <th className="sortable" style={{ textAlign:'left' }} onClick={()=>toggleSort('fullName')}>Nombre y Apellido <SortIco col="fullName" /></th>
                                            <th className="sortable" style={{ textAlign:'left' }} onClick={()=>toggleSort('grade')}>Curso <SortIco col="grade" /></th>
                                            <th className="sortable" style={{ textAlign:'left' }} onClick={()=>toggleSort('level')}>Nivel <SortIco col="level" /></th>
                                            <th style={{ textAlign:'center' }}>Inscripción</th>
                                            <th className="sortable" style={{ textAlign:'center' }} onClick={()=>toggleSort('owed')}>Cuotas <SortIco col="owed" /></th>

                                                    <td style={{ textAlign:'center' }}>
                                                        <span className={"badge "+(f.hasInsc?'b-ipk':'b-ipd')}>{f.hasInsc?'Pagada':'Pendiente'}</span>

                                                        <span className="serif" style={{ fontSize:22, fontWeight:700, color:s.color }}>{f.owed}</span>

                                                            <Icon name="eye" size={14} />
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                            Instituto Leloir · Sistema de Gestión de Cobranzas · {new Date().getFullYear()}
                        </p>
                    </>
                )}
            </main>

            {sel   && <Modal fam={sel} onClose={()=>setSel(null)} />}
            {toast && <Toast msg={toast} onDone={()=>setToast(null)} />}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
